name: business-xray

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional traversal mirror. Postgres stays the system of record; the app
  # works without this service (see README "Graph store").
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/xraypass
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7475:7474", "7688:7687"]
    volumes:
      - neodata:/data
      - ./infra/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://xray:xray@postgres:5432/xray
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: xraypass
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # --- AI provider (never hard-wired in application code) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemma-4-31b-it}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    volumes:
      # Sample CSVs for load-sample/* through the real pipeline.
      - ./samples:/srv/samples:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  neodata: