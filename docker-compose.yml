name: business-xray

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional traversal mirror. Postgres stays the system of record; the app
  # works without this service (see README "Graph store").
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/xraypass
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7475:7474", "7688:7687"]
    volumes:
      - neodata:/data
      - ./infra/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher

  # Transaction pooling in front of Postgres (production target topology).
  pgbouncer:
    image: edoburu/pgbouncer:1.22
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: xray
      DATABASES_PASSWORD: xray
      DATABASES_DBNAME: xray
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: trust
    ports: ["6432:5432"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Malware quarantine sidecar: INSTREAM server on 3310. The API dials it
  # when CLAMAV_HOST is set; unset (dev/test) the scan hook fails open.
  clamav:
    image: clamav/clamav:stable
    environment:
      CLAM_UPDATE: "no"
    ports: ["3310:3310"]
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://xray:xray@postgres:5432/xray
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10
      REDIS_URL: redis://redis:6379/0
      XRAY_READ_MODE: ${XRAY_READ_MODE:-compat}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      XRAY_OCR_BACKEND: ${XRAY_OCR_BACKEND:-}
      S3_BUCKET: ${S3_BUCKET:-xray-uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      XRAY_SPOOL_DIR: /tmp/xray-spool
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ACCESS_MINUTES: 15
      JWT_REFRESH_DAYS: 7
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: xraypass
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # --- AI provider (never hard-wired in application code) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemma-4-31b-it}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    volumes:
      # Sample CSVs for load-sample/* through the real pipeline.
      - ./samples:/srv/samples:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Distributed job consumer: Celery over the same Redis broker the API
  # enqueues to (queues ingest.parse / ingest.compile / sim.compute).
  # Scales independently of the API: `docker compose up --scale worker=3`.
  worker:
    build: ./apps/api
    command: ["celery", "-A", "app.worker", "worker",
              "-Q", "ingest.parse,ingest.compile,sim.compute",
              "-c", "4", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql://xray:xray@postgres:5432/xray
      REDIS_URL: redis://redis:6379/0
      XRAY_READ_MODE: ${XRAY_READ_MODE:-compat}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      XRAY_OCR_BACKEND: ${XRAY_OCR_BACKEND:-}
      S3_BUCKET: ${S3_BUCKET:-xray-uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      XRAY_SPOOL_DIR: /tmp/xray-spool
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  neodata:
  redisdata:
  clamdata: